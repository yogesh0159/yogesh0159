<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Yogesh Chavan - Full-Stack Developer">
  <title>Yogesh Chavan - Full-Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#14245a"/>
      <stop offset="1" stop-color="#3b2f8f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .name { font: 700 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
    .sub  { font: 500 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: .3px; }
    .line { font: 600 20px 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #7dd3fc; opacity: 0; animation: cycle 18s infinite; }
    .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; } .l5 { animation-delay: 12s; } .l6 { animation-delay: 15s; }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(10px); } 3% { opacity: 1; transform: none; } 14% { opacity: 1; transform: none; } 17% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
    .caret { fill: #7dd3fc; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .w1 { animation: drift 14s ease-in-out infinite alternate; }
    .w2 { animation: drift 10s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    .orb { animation: float 7s ease-in-out infinite alternate; transform-origin: center; }
    .orb2 { animation-duration: 9s; animation-delay: -3s; }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-18px); } }
    .in { animation: rise .9s ease-out both; } .in2 { animation-delay: .15s; } .in3 { animation-delay: .3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .l1 { opacity: 1; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <circle class="orb" cx="1010" cy="70" r="150" fill="url(#glow)"/>
    <circle class="orb orb2" cx="160" cy="250" r="120" fill="url(#glow)" opacity="0.7"/>
    <g opacity="0.07" stroke="#ffffff" stroke-width="1">
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
      <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
    </g>
    <g class="w1" opacity="0.35">
      <path d="M0 250 C 120 220 240 280 360 250 S 600 220 720 250 S 960 280 1080 250 S 1320 220 1440 250 V300 H0 Z" fill="#38bdf8"/>
    </g>
    <g class="w2" opacity="0.30">
      <path d="M0 268 C 140 245 280 290 420 268 S 700 245 840 268 S 1120 290 1260 268 S 1400 250 1440 262 V300 H0 Z" fill="#818cf8"/>
    </g>
  </g>
  <g text-anchor="middle">
    <text class="name in" x="600" y="112">Yogesh Chavan</text>
    <rect class="in in2" x="530" y="130" width="140" height="4" rx="2" fill="url(#accent)"/>
    <text class="sub in in2" x="600" y="170">Full-Stack Developer · ERP &amp; Business Software · Desktop Apps · 3D Web</text>
    <g class="in in3">
      <text class="line l1" x="600" y="214">&gt; I build software that runs real businesses</text>
      <text class="line l2" x="600" y="214">&gt; ERP systems · Attendance &amp; Payroll · Billing</text>
      <text class="line l3" x="600" y="214">&gt; PHP 8.5 + MySQL 8.4 · Node.js + Express</text>
      <text class="line l4" x="600" y="214">&gt; Windows desktop apps with Electron</text>
      <text class="line l5" x="600" y="214">&gt; GitHub → AWS automatic deployments</text>
      <text class="line l6" x="600" y="214">&gt; Three.js 3D learning games</text>
    </g>
  </g>
</svg>
